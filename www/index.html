<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Encrucijada Noticias</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { 
      width: 100%; 
      height: 100%; 
      background: #ffffff;
      overflow: hidden;
    }
    #splash {
      position: fixed;
      inset: 0;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
    #splash img {
      width: 120px;
      height: 120px;
      border-radius: 24px;
    }
  </style>
</head>
<body>
  <div id="splash">
    <img src="icon.png"/>
  </div>
  <script>
    window.location.replace("https://encrucijadanoticias.com");
  </script>
</body>
</html>
